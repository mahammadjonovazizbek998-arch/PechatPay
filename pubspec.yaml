name: pechat_pay
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  bloc: ^9.1.3
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.7
  google_fonts: ^8.2.1
  device_info_plus: ^13.2.0
  get_it: ^9.3.0
  time_range_picker: ^2.3.1
  better_analog_time_picker: ^0.0.2
  url_launcher: ^6.3.2
  pull_to_refresh: ^2.0.0
  table_calendar: ^3.3.0
  logger: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icons/logo_p_p.png"
  android: true
  ios: true
flutter_native_splash:
  color: "F8FAFF"
  image: "assets/icons/logo_p_p.png"

  android_12:
    color: "#F8FAFF"
    image: "assets/icons/logo_p_p.png"
    # Oq kvadratni yo'qotish uchun fon rangini bir xil qilamiz
    icon_background_color: "F8FAFF"
flutter:
  uses-material-design: true
  assets:
    - assets/icons/logo_p_p.png
    - assets/icons/img.png
    - assets/
